<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>القاموس التفاعلي — The Examiner</title>
<style>
  :root{
    --navy:#0f2a4a;
    --navy-2:#16385f;
    --gold:#d4af37;
    --gold-2:#e8c765;
    --bg:#f4f6fa;
    --card:#ffffff;
    --text:#1c2b3a;
    --muted:#5b6b7c;
    --border:#e2e7ee;
  }
  *{box-sizing:border-box;}
  html{ direction:rtl; }
  body{
    margin:0;
    font-family:'Tahoma','Segoe UI',Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100%;
    direction:rtl;
  }
  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:22px 16px 26px;
    text-align:center;
    position:sticky;
    top:env(safe-area-inset-top, 0px);
    z-index:5;
    box-shadow:0 4px 14px rgba(15,42,74,.25);
  }
  header h1{
    margin:0 0 4px;
    font-size:1.35rem;
    letter-spacing:.3px;
  }
  .brand-tag{
    display:inline-block;
    font-size:.7rem;
    font-weight:bold;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
    background:rgba(212,175,55,.12);
    border:1px solid rgba(212,175,55,.4);
    padding:3px 12px;
    border-radius:999px;
    margin-bottom:10px;
    unicode-bidi:isolate;
    direction:ltr;
  }
  header p{
    margin:0 0 16px;
    font-size:.85rem;
    color:#cfe0f2;
  }
  .search-wrap{
    max-width:640px;
    margin:0 auto;
    position:relative;
  }
  #search{
    width:100%;
    padding:13px 46px 13px 16px;
    border-radius:12px;
    border:none;
    font-size:1rem;
    outline:none;
    background:#fff;
    color:var(--text);
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .search-wrap svg{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    width:20px;
    height:20px;
    color:var(--navy);
    opacity:.6;
    pointer-events:none;
  }
  .filters{
    max-width:640px;
    margin:12px auto 0;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .filter-chip{
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08);
    color:#fff;
    padding:5px 13px;
    border-radius:999px;
    font-size:.75rem;
    cursor:pointer;
    transition:.15s;
  }
  .filter-chip.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#1c2b3a;
    font-weight:bold;
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:16px 14px 60px;
  }
  #count{
    text-align:center;
    color:var(--muted);
    font-size:.82rem;
    margin:2px 0 14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 4px rgba(15,42,74,.06);
  }
  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .word-en{
    font-size:1.25rem;
    font-weight:700;
    color:var(--navy);
    direction:ltr;
    text-align:left;
    unicode-bidi:isolate;
  }
  .lvl-badge{
    display:inline-block;
    font-size:.68rem;
    font-weight:bold;
    color:#fff;
    background:var(--navy);
    padding:2px 9px;
    border-radius:999px;
    margin-inline-start:8px;
    vertical-align:middle;
  }
  .speak-row{
    display:flex;
    gap:8px;
  }
  .speak-btn{
    border:1px solid var(--border);
    background:#f7f9fc;
    color:var(--navy);
    border-radius:9px;
    padding:6px 10px;
    font-size:.78rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
    transition:.15s;
    white-space:nowrap;
  }
  .speak-btn:hover{ background:var(--navy); color:#fff; }
  .speak-btn:active{ transform:scale(.96); }
  .speak-btn.playing{ background:var(--gold); border-color:var(--gold); color:#1c2b3a; }
  .meaning{
    margin-top:10px;
    font-size:.92rem;
    line-height:1.6;
  }
  .meaning .en{ color:var(--muted); direction:ltr; text-align:left; unicode-bidi:isolate; display:block; }
  .meaning .ar{ color:var(--text); font-weight:600; margin-top:2px; display:block; }
  .example{
    margin-top:10px;
    background:#f6f8fb;
    border-inline-start:3px solid var(--gold);
    padding:8px 12px;
    border-radius:8px;
    font-size:.86rem;
  }
  .example .ex-en{ direction:ltr; text-align:left; unicode-bidi:isolate; display:block; color:var(--navy); font-style:italic; }
  .example .ex-ar{ display:block; color:var(--muted); margin-top:4px; }
  .empty{
    text-align:center;
    color:var(--muted);
    padding:50px 10px;
    font-size:.95rem;
  }
  .empty svg{ width:46px;height:46px;opacity:.35;margin-bottom:10px; }
  .voice-note{
    text-align:center;
    color:#8a96a3;
    font-size:.7rem;
    margin-top:20px;
  }
  ::selection{ background:var(--gold-2); }
</style>
</head>
<body>


<header>
  <div class="brand-tag">Mindproo Academy</div>
  <h1>📖 القاموس التفاعلي <span style="unicode-bidi:isolate;white-space:nowrap;">— The Examiner</span></h1>
  <p>ابحث عن أي كلمة إنجليزية أو بالعربي، واستمع لنطقها بالأمريكي والبريطاني</p>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="اكتب كلمة... مثال: water أو ماء" autocomplete="off" />
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </div>
  <div class="filters" id="filters">
    <span class="filter-chip active" data-lvl="all">الكل</span>
    <span class="filter-chip" data-lvl="A1">A1</span>
    <span class="filter-chip" data-lvl="A2">A2</span>
    <span class="filter-chip" data-lvl="B1">B1</span>
    <span class="filter-chip" data-lvl="B2">B2</span>
    <span class="filter-chip" data-lvl="C1">C1</span>
    <span class="filter-chip" data-lvl="C2">C2</span>
    <span class="filter-chip" data-lvl="ROOT">Roots</span>
  </div>
</header>

<main>
  <div id="count"></div>
  <div id="results"></div>
  <div class="voice-note">🔊 النطق يعتمد على متصفحك — تأكد من رفع الصوت</div>
</main>

urn out", "lvl": "B2", "en": "To become extremely tired from overworking", "ar": "يصاب بالإرهاق", "ex": "Many teachers burn out after years of stress.", "exAr": "يصاب كثير من المعلمين بالإرهاق بعد سنوات من التوتر."}, {"w": "call for", "lvl": "B1", "en": "To require or demand something", "ar": "يستدعي / يطالب بـ", "ex": "This situation calls for immediate action.", "exAr": "هذا الموقف يستدعي إجراءً فوريًا."}, {"w": "call in", "lvl": "B1", "en": "To ask someone to come, often for help", "ar": "يستدعي", "ex": "They called in an expert to fix the machine.", "exAr": "استدعوا خبيرًا لإصلاح الآلة."}, {"w": "call on", "lvl": "B1", "en": "To visit someone; or to ask someone to do something", "ar": "يزور / يطلب من", "ex": "The teacher called on a student to answer.", "exAr": "طلب المعلم من طالب أن يجيب."}, {"w": "call up", "lvl": "A2", "en": "To phone someone", "ar": "يتصل بـ", "ex": "I'll call up my friend tonight.", "exAr": "سأتصل بصديقي الليلة."}, {"w": "care for", "lvl": "B1", "en": "To look after someone; or to like something", "ar": "يعتني بـ / يحب", "ex": "She cares for her elderly mother.", "exAr": "تعتني بأمها المسنة."}, {"w": "cheer up", "lvl": "A2", "en": "To become or make someone happier", "ar": "يبتهج / يبهج شخصًا", "ex": "A funny movie always cheers me up.", "exAr": "فيلم مضحك دائمًا يبهجني."}, {"w": "chip in", "lvl": "B2", "en": "To contribute money or help toward something", "ar": "يساهم بحصته", "ex": "Everyone chipped in for the gift.", "exAr": "ساهم الجميع بحصته في الهدية."}, {"w": "clean up", "lvl": "A2", "en": "To make a place tidy", "ar": "ينظف", "ex": "Let's clean up the kitchen together.", "exAr": "لننظف المطبخ معًا."}, {"w": "close down", "lvl": "B1", "en": "To stop operating permanently", "ar": "يغلق نهائيًا", "ex": "The old factory closed down last year.", "exAr": "أغلق المصنع القديم نهائيًا العام الماضي."}, {"w": "come by", "lvl": "B1", "en": "To obtain something; or to visit briefly", "ar": "يحصل على / يمر بزيارة", "ex": "Good jobs are hard to com "", "ex": "respire, inspire, conspire", "exAr": "أمثلة: يتنفس، يلهم، يتآمر"}, {"w": "tang/tact-", "lvl": "ROOT", "en": "Root meaning \"touch\"", "ar": "جذر بمعنى \"يلمس\"", "ex": "tangent, contact, tangible", "exAr": "أمثلة: مماس، اتصال، ملموس"}, {"w": "temp-", "lvl": "ROOT", "en": "Root meaning \"time\"", "ar": "جذر بمعنى \"وقت\"", "ex": "temporary, contemporary, tempo", "exAr": "أمثلة: مؤقت، معاصر، إيقاع"}, {"w": "ten/tain-", "lvl": "ROOT", "en": "Root meaning \"hold\"", "ar": "جذر بمعنى \"يمسك\"", "ex": "retain, maintain, tenant", "exAr": "أمثلة: يحتفظ بـ، يحافظ على، مستأجر"}, {"w": "terr-", "lvl": "ROOT", "en": "Root meaning \"earth, land\"", "ar": "جذر بمعنى \"أرض\"", "ex": "territory, terrestrial, subterranean", "exAr": "أمثلة: إقليم، أرضي، تحت الأرض"}, {"w": "urb-", "lvl": "ROOT", "en": "Root meaning \"city\"", "ar": "جذر بمعنى \"مدينة\"", "ex": "urban, suburb", "exAr": "أمثلة: حضري، ضاحية"}, {"w": "vac-", "lvl": "ROOT", "en": "Root meaning \"empty\"", "ar": "جذر بمعنى \"فارغ\"", "ex": "vacant, evacuate, vacuum", "exAr": "أمثلة: شاغر، يُخلي، فراغ"}, {"w": "val-", "lvl": "ROOT", "en": "Root meaning \"strength, worth\"", "ar": "جذر بمعنى \"قوة / قيمة\"", "ex": "valid, value, prevail", "exAr": "أمثلة: صالح/صحيح، قيمة، يسود/ينتصر"}, {"w": "ven/vent-", "lvl": "ROOT", "en": "Root meaning \"come\"", "ar": "جذر بمعنى \"يأتي\"", "ex": "convene, prevent, invent", "exAr": "أمثلة: يجتمع، يمنع، يخترع"}, {"w": "ver-", "lvl": "ROOT", "en": "Root meaning \"true\"", "ar": "جذر بمعنى \"صحيح\"", "ex": "verify, verdict, veracity", "exAr": "أمثلة: يتحقق من، حكم/قرار، صدق/صحة"}, {"w": "vinc/vict-", "lvl": "ROOT", "en": "Root meaning \"conquer\"", "ar": "جذر بمعنى \"ينتصر / يقهر\"", "ex": "convince, victory, invincible", "exAr": "أمثلة: يقنع، انتصار، لا يُقهر"}, {"w": "viv-", "lvl": "ROOT", "en": "Root meaning \"live\"", "ar": "جذر بمعنى \"يعيش\"", "ex": "survive, vivid, revive", "exAr": "أمثلة: ينجو، حيوي/واضح، يحيي/ينعش"}, {"w": "voc/vok-", "lvl": "ROOT", "en": "Root meaning \"call, voice\"", "ar": "جذر بمعنى \"صوت / نداء\"", "ex": "vocal, invoke, vocabulary", "exAr": "أمثلة: صوتي، يستحضر/يستدعي، مفردات"}, {"w": "vol-", "lvl": "ROOT", "en": "Root meaning \"wish, will\"", "ar": "جذر بمعنى \"إرادة\"", "ex": "voluntary, malevolent, benevolent", "exAr": "أمثلة: طوعي، حاقد، خيّر"}, {"w": "xeno-", "lvl": "ROOT", "en": "Root meaning \"stranger, foreign\"", "ar": "جذر بمعنى \"غريب / أجنبي\"", "ex": "xenophobia", "exAr": "أمثلة: كراهية الأجانب"}, {"w": "zo/zoo-", "lvl": "ROOT", "en": "Root meaning \"animal\"", "ar": "جذر بمعنى \"حيوان\"", "ex": "zoology, zoo", "exAr": "أمثلة: علم الحيوان، حديقة الحيوان"}];

var state = { q: "", lvl: "all" };

function norm(s){ return (s||"").toLowerCase().trim(); }

function matches(item, q){
  if(!q) return true;
  q = norm(q);
  return norm(item.w).indexOf(q) !== -1 ||
         norm(item.en).indexOf(q) !== -1 ||
         (item.ar||"").indexOf(q) !== -1 ||
         (item.exAr||"").indexOf(q) !== -1;
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function render(){
  var list = WORDS.filter(function(item){
    return (state.lvl === "all" || item.lvl === state.lvl) && matches(item, state.q);
  });

  var countEl = document.getElementById('count');
  var resEl = document.getElementById('results');

  if(list.length === 0){
    countEl.textContent = "";
    resEl.innerHTML = '<div class="empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
      '<div>لا توجد نتائج مطابقة لبحثك</div></div>';
    return;
  }

  countEl.textContent = "عدد الكلمات: " + list.length + " من أصل " + WORDS.length;

  var shown = list.slice(0, 120);
  resEl.innerHTML = shown.map(function(item, idx){
    var uid = 'w' + idx + '_' + item.w.replace(/[^a-zA-Z]/g,'');
    return '' +
      '<div class="card">' +
        '<div class="card-top">' +
          '<div><span class="word-en">' + escapeHtml(item.w) + '</span><span class="lvl-badge">' + (item.lvl === "ROOT" ? "Root" : item.lvl) + '</span></div>' +
          '<div class="speak-row">' +
            '<button class="speak-btn" data-word="' + encodeURIComponent(item.w) + '" data-ex="' + encodeURIComponent(item.ex) + '" data-accent="US">🇺🇸 US</button>' +
            '<button class="speak-btn" data-word="' + encodeURIComponent(item.w) + '" data-ex="' + encodeURIComponent(item.ex) + '" data-accent="GB">🇬🇧 UK</button>' +
          '</div>' +
        '</div>' +
        '<div class="meaning">' +
          '<span class="en">' + escapeHtml(item.en) + '</span>' +
          '<span class="ar">' + escapeHtml(item.ar) + '</span>' +
        '</div>' +
        '<div class="example">' +
          '<span class="ex-en">' + escapeHtml(item.ex) + '</span>' +
          '<span class="ex-ar">' + escapeHtml(item.exAr) + '</span>' +
        '</div>' +
      '</div>';
  }).join('');

  if(list.length > shown.length){
    resEl.innerHTML += '<div class="empty" style="padding:16px;">اكتب كلمة أكثر تحديدًا لتضييق النتائج (يتم عرض ' + shown.length + ' فقط الآن)</div>';
  }
}

// ---- Speech ----
var voicesCache = [];
function loadVoices(){ voicesCache = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice(accent){
  var wantLang = accent === 'US' ? 'en-US' : 'en-GB';
  var exact = voicesCache.filter(function(v){ return v.lang === wantLang; });
  if(exact.length) return exact[0];
  var loose = voicesCache.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf(accent === 'US' ? 'en-us' : 'en-gb') !== -1; });
  if(loose.length) return loose[0];
  var anyEn = voicesCache.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('en') === 0; });
  return anyEn.length ? anyEn[0] : null;
}

function speak(word, example, accent, btn){
  if(!window.speechSynthesis){
    alert('متصفحك لا يدعم خاصية النطق الصوتي.');
    return;
  }
  window.speechSynthesis.cancel();
  var text = word + ". " + example;
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = accent === 'US' ? 'en-US' : 'en-GB';
  var v = pickVoice(accent);
  if(v) utter.voice = v;
  utter.rate = 0.92;
  if(btn){
    btn.classList.add('playing');
    utter.onend = function(){ btn.classList.remove('playing'); };
    utter.onerror = function(){ btn.classList.remove('playing'); };
  }
  window.speechSynthesis.speak(utter);
}

document.getElementById('results').addEventListener('click', function(e){
  var btn = e.target.closest('.speak-btn');
  if(!btn) return;
  var word = decodeURIComponent(btn.getAttribute('data-word'));
  var ex = decodeURIComponent(btn.getAttribute('data-ex'));
  var accent = btn.getAttribute('data-accent');
  speak(word, ex, accent, btn);
});

document.getElementById('search').addEventListener('input', function(e){
  state.q = e.target.value;
  render();
});

document.getElementById('filters').addEventListener('click', function(e){
  var chip = e.target.closest('.filter-chip');
  if(!chip) return;
  document.querySelectorAll('.filter-chip').forEach(function(c){ c.classList.remove('active'); });
  chip.classList.add('active');
  state.lvl = chip.getAttribute('data-lvl');
  render();
});

render();
</script>
